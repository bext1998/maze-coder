name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate skillpack
        run: |
          bash scripts/validate-skillpack.sh
          bash scripts/validate-skills-functional.sh
          bash scripts/validate-adaptive-scenarios.sh

      - name: Verify adapters are in sync
        run: |
          bash scripts/sync-adapters.sh
          git diff --exit-code

      - name: Build release archive
        run: |
          zip -r "maze-coder-adapters-${GITHUB_REF_NAME}.zip" adapters README.md LICENSE

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "maze-coder-adapters-${GITHUB_REF_NAME}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
