<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">maze-coder animated workflow logo</title>
  <desc id="desc">An animated maze workflow banner showing eleven skill nodes flowing from a terminal prompt to Claude Code, Codex, Cursor, and opencode adapters.</desc>
  <style>
    :root {
      color-scheme: light dark;
    }

    .frame {
      fill: #f8fafc;
      stroke: #d8dee9;
    }

    .shadow {
      fill: #0f172a;
      opacity: 0.08;
    }

    .maze-base {
      fill: none;
      stroke: #cbd5e1;
      stroke-width: 16;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .maze-trace {
      fill: none;
      stroke: url(#traceGradient);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 868;
      stroke-dashoffset: 868;
      animation: trace 7.2s ease-in-out infinite;
    }

    .node {
      fill: #ffffff;
      stroke: #2563eb;
      stroke-width: 3;
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 7.2s ease-in-out infinite;
    }

    .adapter-label,
    .brand,
    .tagline,
    .terminal-prompt {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    .adapter {
      fill: #ffffff;
      stroke: #64748b;
      stroke-width: 2;
      transform-box: fill-box;
      transform-origin: center;
      animation: adapterGlow 7.2s ease-in-out infinite;
    }

    .adapter-label {
      fill: #0f172a;
      font-size: 12px;
      font-weight: 700;
      text-anchor: middle;
    }

    .brand {
      fill: #0f172a;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .tagline {
      fill: #475569;
      font-size: 14px;
      font-weight: 600;
    }

    .terminal-frame {
      fill: #0f172a;
      stroke: #0f766e;
      stroke-width: 3;
    }

    .terminal-prompt {
      fill: #14b8a6;
      font-size: 26px;
      font-weight: 800;
      text-anchor: middle;
    }

    .exit-line {
      stroke: #94a3b8;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 8 9;
    }

    .n1  { animation-delay: 0.00s; }
    .n2  { animation-delay: 0.42s; }
    .n3  { animation-delay: 0.59s; }
    .n4  { animation-delay: 0.92s; }
    .n5  { animation-delay: 1.22s; }
    .n6  { animation-delay: 1.61s; }
    .n7  { animation-delay: 1.86s; }
    .n8  { animation-delay: 2.21s; }
    .n9  { animation-delay: 2.42s; }
    .n10 { animation-delay: 2.83s; }
    .n11 { animation-delay: 3.45s; }

    .a1 { animation-delay: 4.0s; }
    .a2 { animation-delay: 4.2s; }
    .a3 { animation-delay: 4.4s; }
    .a4 { animation-delay: 4.6s; }

    @keyframes trace {
      0% { stroke-dashoffset: 868; opacity: 0.35; }
      14% { opacity: 1; }
      58% { stroke-dashoffset: 0; opacity: 1; }
      78% { stroke-dashoffset: 0; opacity: 0.85; }
      100% { stroke-dashoffset: -868; opacity: 0.25; }
    }

    @keyframes pulse {
      0%, 22%, 100% {
        fill: #ffffff;
        stroke: #2563eb;
        transform: scale(1);
      }
      8% {
        fill: #dbeafe;
        stroke: #1d4ed8;
        transform: scale(1.16);
      }
    }

    @keyframes adapterGlow {
      0%, 30%, 100% { stroke: #64748b; stroke-width: 2; }
      12% { stroke: #0891b2; stroke-width: 3; }
    }

    @media (prefers-color-scheme: dark) {
      .frame { fill: #111827; stroke: #334155; }
      .adapter, .node { fill: #172033; }
      .brand, .adapter-label { fill: #e5e7eb; }
      .tagline { fill: #cbd5e1; }
      .maze-base { stroke: #334155; }
      .shadow { opacity: 0.18; }
    }

    @media (prefers-reduced-motion: reduce) {
      .maze-trace,
      .node,
      .adapter {
        animation: none;
      }

      .maze-trace {
        stroke-dashoffset: 0;
      }
    }
  </style>
  <defs>
    <linearGradient id="traceGradient" x1="140" x2="760" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14b8a6" />
      <stop offset="0.45" stop-color="#2563eb" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <rect class="frame" x="8" y="8" width="944" height="284" rx="24" />
  <ellipse class="shadow" cx="480" cy="269" rx="370" ry="12" />

  <g transform="translate(38 44)">
    <rect class="terminal-frame" x="0" y="0" width="88" height="72" rx="10" />
    <text class="terminal-prompt" x="44" y="46">&gt;_</text>
  </g>

  <text class="brand" x="154" y="74">maze-coder</text>
  <text class="tagline" x="156" y="101">Markdown-first workflow skills for portable coding agents</text>

  <path class="maze-base" d="M156 203 H244 V169 H314 V230 H395 V178 H469 V220 H556 V161 H626 V203 H734" />
  <path class="maze-trace" d="M156 203 H244 V169 H314 V230 H395 V178 H469 V220 H556 V161 H626 V203 H734" />

  <g transform="translate(156 203)">
    <circle class="node n1" r="13" />
  </g>
  <g transform="translate(244 203)">
    <circle class="node n2" r="13" />
  </g>
  <g transform="translate(244 169)">
    <circle class="node n3" r="13" />
  </g>
  <g transform="translate(314 169)">
    <circle class="node n4" r="13" />
  </g>
  <g transform="translate(314 230)">
    <circle class="node n5" r="13" />
  </g>
  <g transform="translate(395 230)">
    <circle class="node n6" r="13" />
  </g>
  <g transform="translate(395 178)">
    <circle class="node n7" r="13" />
  </g>
  <g transform="translate(469 178)">
    <circle class="node n8" r="13" />
  </g>
  <g transform="translate(469 220)">
    <circle class="node n9" r="13" />
  </g>
  <g transform="translate(556 220)">
    <circle class="node n10" r="13" />
  </g>
  <g transform="translate(626 161)">
    <circle class="node n11" r="13" />
  </g>

  <line class="exit-line" x1="734" y1="203" x2="790" y2="122" />
  <line class="exit-line" x1="734" y1="203" x2="790" y2="170" />
  <line class="exit-line" x1="734" y1="203" x2="790" y2="218" />
  <line class="exit-line" x1="734" y1="203" x2="790" y2="266" />

  <g>
    <rect class="adapter a1" x="790" y="101" width="118" height="36" rx="10" />
    <text class="adapter-label" x="849" y="124">Claude Code</text>
  </g>
  <g>
    <rect class="adapter a2" x="790" y="149" width="118" height="36" rx="10" />
    <text class="adapter-label" x="849" y="172">Codex</text>
  </g>
  <g>
    <rect class="adapter a3" x="790" y="197" width="118" height="36" rx="10" />
    <text class="adapter-label" x="849" y="220">Cursor</text>
  </g>
  <g>
    <rect class="adapter a4" x="790" y="245" width="118" height="36" rx="10" />
    <text class="adapter-label" x="849" y="268">opencode</text>
  </g>
</svg>
